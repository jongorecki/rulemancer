<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rulemancer — enter your access code</title>
<link rel="icon" href="assets/rulemancer-mark.svg" />
<link rel="stylesheet" href="colors_and_type.css?v=3" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; font-family: var(--font-sans);
    overflow-x: hidden;
  }

  /* -----------------------------------------------------------------------
   * The sigil: an arcane summoning circle that is literally this system's
   * retrieval architecture, drawn as inline SVG (no external requests).
   * Reading it from the outside in:
   *   outer ring + entry mark  -> the question enters
   *   dashed rotating ring     -> the Haiku rewriter, rephrasing it
   *   tick ring                -> the Comprehensive Rules corpus (64 ticks
   *                                drawn as a representative sample of the
   *                                real 3,619 indexed chunks -- not a literal
   *                                count)
   *   inward rays (x15)        -> vector search pulling the top 15 chunks in
   *   branch to the lower node -> a [Card Name] reference resolving via
   *                                Scryfall, then its rulings passing
   *                                through a relevance filter (most threads
   *                                drop before reaching the core)
   *   core                     -> claude-opus-5, where both routes converge
   *   the bright southbound stroke -> the cited rule leaving the circle
   * Decoration only: aria-hidden, not focusable, and every animation is
   * killed under prefers-reduced-motion. It sits behind the opaque gate
   * card (position: fixed, z-index: 0), so it never touches the contrast of
   * any text -- the card's solid background does that job on its own.
   * ------------------------------------------------------------------- */
  .rm-sigil {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none; opacity: .55;
  }
  .rm-sigil .rm-ring-outer,
  .rm-sigil .rm-ring-rewrite,
  .rm-sigil .rm-ring-retrieved,
  .rm-sigil .rm-ticks line { opacity: .5; }
  .rm-sigil .rm-entry { opacity: .7; }
  .rm-sigil .rm-entry-mark { fill: var(--plum-300); opacity: .7; }

  .rm-sigil .rm-ring-rewrite {
    transform-origin: 240px 240px;
    animation: rm-rotate 60s linear infinite;
  }

  .rm-sigil .rm-route-rules {
    filter: drop-shadow(0 0 3px rgba(148, 105, 180, .55));
    animation: rm-alt-rules 9s ease-in-out infinite;
  }
  .rm-sigil .rm-route-rules line {
    stroke-dasharray: 5 9;
    animation: rm-trace 3.2s linear infinite;
  }
  .rm-sigil .rm-route-card {
    filter: drop-shadow(0 0 3px rgba(48, 155, 140, .55));
    animation: rm-alt-card 9s ease-in-out infinite;
  }
  .rm-sigil .rm-route-card line,
  .rm-sigil .rm-route-card path.rm-branch-in,
  .rm-sigil .rm-route-card line.rm-branch-out {
    stroke-dasharray: 5 9;
    animation: rm-trace 3.2s linear infinite;
  }
  .rm-sigil .rm-thread-drop { opacity: .45; stroke-dasharray: 3 6; }
  .rm-sigil .rm-thread-reach { opacity: .9; }

  .rm-sigil .rm-core {
    filter: drop-shadow(0 0 6px rgba(48, 155, 140, .55));
    animation: rm-core-pulse 4s ease-in-out infinite;
  }

  .rm-sigil .rm-exit {
    stroke-dasharray: 14 18;
    filter: drop-shadow(0 0 4px rgba(126, 207, 194, .75));
    animation: rm-exit-pulse 3.4s linear infinite;
  }
  .rm-sigil .rm-exit-arrow { fill: var(--teal-300); opacity: .85; }

  @keyframes rm-rotate { to { transform: rotate(360deg); } }
  @keyframes rm-trace { to { stroke-dashoffset: -140; } }
  @keyframes rm-alt-rules {
    0%, 42% { opacity: 1; }
    50%, 92% { opacity: .25; }
    100% { opacity: 1; }
  }
  @keyframes rm-alt-card {
    0%, 42% { opacity: .25; }
    50%, 92% { opacity: 1; }
    100% { opacity: .25; }
  }
  @keyframes rm-core-pulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(48, 155, 140, .5)); }
    50% { filter: drop-shadow(0 0 13px rgba(48, 155, 140, .9)); }
  }
  @keyframes rm-exit-pulse {
    0% { stroke-dashoffset: 0; opacity: .5; }
    50% { opacity: 1; }
    100% { stroke-dashoffset: -256; opacity: .5; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rm-sigil, .rm-sigil * { animation: none !important; }
  }

  .rm-gate-card {
    position: relative; z-index: 1;
    max-width: 420px; width: 100%; background: var(--bg-card);
    border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding: var(--space-6) var(--space-5);
    text-align: center;
  }
  .rm-gate-mark { width: 40px; height: 40px; display: block; margin: 0 auto var(--space-3); opacity: .9; }
  .rm-gate-wordmark { margin: 0 0 var(--space-2); display: flex; justify-content: center; }
  .rm-gate-wordmark svg { width: min(300px, 68vw); height: auto; display: block; color: var(--accent); }
  .rm-gate-sub {
    color: var(--fg-secondary); font-size: var(--fs-base); line-height: var(--lh-base);
    margin: 0 0 var(--space-5);
  }
  form { display: flex; flex-direction: column; gap: var(--space-3); }
  label {
    text-align: left; font-size: var(--fs-sm); font-weight: var(--fw-medium);
    color: var(--fg-secondary);
  }
  input[type=text] {
    width: 100%; padding: 0.75rem 1rem; font-size: var(--fs-base); font-family: var(--font-mono);
    background: var(--bg-elevated); border: 1px solid var(--border-default);
    border-radius: var(--radius-md); color: var(--fg-primary);
  }
  input[type=text]::placeholder { color: var(--fg-subtle); }
  input[type=text]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent);
  }
  input[aria-invalid="true"] { border-color: var(--status-red); }
  button {
    width: 100%; padding: 0.75rem 1rem; font-size: var(--fs-base); font-weight: var(--fw-semibold);
    font-family: var(--font-sans);
    /* plum-500, not --accent (plum-400): --accent's contrast against
       --fg-on-garnet text measures 3.60:1, below AA's 4.5:1 for normal-size
       text. plum-500 measures 5.16:1 (hover plum-600: 6.98:1). Still an
       existing brand token from colors_and_type.css -- not a new color. */
    background: var(--plum-500); color: var(--fg-on-garnet, #fff);
    border: none; border-radius: var(--radius-md); cursor: pointer;
    transition: background var(--t-fast);
  }
  button:hover:not(:disabled) { background: var(--plum-600); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { background: var(--bg-muted); color: var(--fg-subtle); cursor: not-allowed; }
  #msg {
    margin-top: var(--space-3); font-size: var(--fs-sm); min-height: 1.2em;
    /* status-red on bg-card alone measures 4.37:1 -- just under AA's 4.5:1.
       Mixing in 20% white (still derived from the status-red token, not a
       new hardcoded color) brings it to ~5.7:1. */
    color: color-mix(in srgb, var(--status-red) 80%, white);
  }
  .rm-gate-footer {
    margin-top: var(--space-5); font-size: var(--fs-xs); color: var(--fg-subtle);
  }
</style>
</head>

  <p class="rm-gate-sub">This demo is access-code gated. If you don't have a code, ask Jon Gorecki for one.</p>
  <form id="gate-form" novalidate>
    <label for="code">Access code</label>
    <input type="text" id="code" name="code" placeholder="e.g. osprey-sycamore-peregrine-23"
           autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
    <button type="submit" id="submit-btn">Unlock</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
  <p class="rm-gate-footer">Rulemancer is a personal project by Jon Gorecki.</p>
</div>
<script>
  document.getElementById("gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const input = document.getElementById("code");
    const msg = document.getElementById("msg");
    const code = input.value.trim();
    if (!code) {
      input.setAttribute("aria-invalid", "true");
      msg.textContent = "Enter a code first.";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Checking…";
    msg.textContent = "";
    input.removeAttribute("aria-invalid");
    try {
      const resp = await fetch("/unlock", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "code=" + encodeURIComponent(code),
      });
      if (resp.ok) {
        window.location.reload();
        return;
      }
      input.setAttribute("aria-invalid", "true");
      msg.textContent = "That code didn't work. Check it and try again.";
    } catch (err) {
      msg.textContent = "Something went wrong. Try again in a moment.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Unlock";
    }
  });
</script>
