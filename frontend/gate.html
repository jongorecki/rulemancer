<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rulemancer — enter your access code</title>
<link rel="icon" href="assets/rulemancer-mark.svg" />
<link rel="stylesheet" href="colors_and_type.css?v=3" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; font-family: var(--font-sans);
    overflow-x: hidden;
  }

  /* -----------------------------------------------------------------------
   * The sigil: a summoning-circle ornament, drawn as inline SVG (no external
   * requests, no font glyphs -- every mark below is a hand-built <path>).
   * Pure decoration: nested rings and two interlocking star polygons in
   * plum for the static geometry, with teal energy that travels around the
   * rings and star edges as soft glowing pulses. It does not encode this
   * system's architecture, pipeline, or any real count -- it is ornament,
   * not a diagram.
   *
   * FIX ROUND (2026-07-27): the sigil used to be `inset:0; width/height:100%`,
   * so its scale shrank with the viewport while the gate card kept a fixed
   * max-width. Below ~1000px viewport width, every star/pulse fell inside the
   * card's footprint and got hidden behind it -- all that was left visible
   * was the outer ring and the glyph band ("a circle and a circle of dots").
   * Fix: the sigil now has a size FLOOR (`max(1100px, 100vmin)`) so its scale
   * never drops below a fixed minimum regardless of viewport, and every piece
   * of load-bearing geometry (both star polygons, their vertex nodes, every
   * teal pulse) was moved out to a radius that clears the card's footprint
   * at that floor scale, with margin. The card's footprint is dead space --
   * nothing essential is drawn where it will always be covered.
   *
   * aria-hidden, not focusable, and every animation is killed under
   * prefers-reduced-motion. It sits behind the opaque gate card (position:
   * fixed, z-index: 0), so it never touches the contrast of any text -- the
   * card's solid background does that job on its own.
   * ------------------------------------------------------------------- */
  .rm-sigil {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: max(1100px, 100vmin); height: max(1100px, 100vmin);
    z-index: 0; pointer-events: none; opacity: .68;
  }
  .rm-sigil .rm-static { opacity: .55; }
  .rm-sigil .rm-static-faint { opacity: .35; }
  .rm-sigil .rm-node { fill: var(--plum-300); opacity: .6; }

  .rm-sigil .rm-grp-outer  { transform-origin: 240px 240px; animation: rm-spin-cw  220s linear infinite; }
  .rm-sigil .rm-grp-glyphs { transform-origin: 240px 240px; animation: rm-spin-ccw 150s linear infinite; }
  .rm-sigil .rm-grp-dashed { transform-origin: 240px 240px; animation: rm-spin-cw   95s linear infinite; }
  .rm-sigil .rm-grp-double { transform-origin: 240px 240px; animation: rm-spin-ccw 130s linear infinite; }
  .rm-sigil .rm-grp-star9  { transform-origin: 240px 240px; animation: rm-spin-cw  190s linear infinite; }
  .rm-sigil .rm-grp-star7  { transform-origin: 240px 240px; animation: rm-spin-ccw 105s linear infinite; }

  @keyframes rm-spin-cw  { to { transform: rotate(360deg); } }
  @keyframes rm-spin-ccw { to { transform: rotate(-360deg); } }

  /* Teal pulses: pathLength="100" on every pulse element normalizes stroke
     length regardless of true geometry, so "one lap" is always dashoffset
     -100/100 -- a clean, seamless loop with no visible reset. Each pulse
     sits inside the same rotating group as the ring/star it traces, so it
     also drifts with the slow counter-rotation above it.

     FIX ROUND (2026-07-27): Jon reported the glow "blinking a bunch" on the
     live deployment. Root cause was `rm-flicker` -- five pulses each cycling
     opacity .55->1->.55 on their OWN short, near-but-unequal period (3.1s,
     3.4s, 3.9s, 4.6s, 5.2s). A ~3-5s full swing between "dim" and "full
     bright" reads as a blink, not a breath, and five such cycles running at
     close-but-different speeds drift in and out of phase with each other,
     producing an irregular beat pattern on top of the individual blinking --
     it never looked calm because it never repeated calmly either.
     Fix: one shared, much longer period (36s) with a narrow opacity range
     (never below .58, never above .92 -- nothing snaps fully on or off),
     staggered by even phase offsets (36s / 5) so the five pulses ripple
     through the circle one after another instead of firing in an
     uncoordinated cluster. Travel durations were also lengthened
     substantially (70-150s, still all comfortably distinct) so a streak's
     lap around its ring takes long enough that the whole composition reads
     as "drifting," not "racing." */
  .rm-sigil .rm-pulse { fill: none; stroke: var(--teal-300); filter: url(#rm-glow); }
  .rm-sigil .rm-pulse-a { stroke-dasharray: 16 84; animation: rm-travel      90s linear infinite, rm-flicker 36s ease-in-out infinite; }
  .rm-sigil .rm-pulse-b { stroke-dasharray: 11 89; animation: rm-travel-rev 110s linear infinite, rm-flicker 36s ease-in-out infinite -7.2s; }
  .rm-sigil .rm-pulse-c { stroke-dasharray: 22 78; animation: rm-travel      80s linear infinite, rm-flicker 36s ease-in-out infinite -14.4s; }
  .rm-sigil .rm-pulse-d { stroke-dasharray: 13 87; animation: rm-travel-rev 100s linear infinite, rm-flicker 36s ease-in-out infinite -21.6s; }
  .rm-sigil .rm-pulse-e { stroke-dasharray: 18 82; animation: rm-travel     130s linear infinite, rm-flicker 36s ease-in-out infinite -28.8s; }

  @keyframes rm-travel     { to { stroke-dashoffset: -100; } }
  @keyframes rm-travel-rev { to { stroke-dashoffset: 100; } }
  @keyframes rm-flicker {
    0%, 100% { opacity: .58; }
    50% { opacity: .92; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rm-sigil, .rm-sigil * { animation: none !important; }
  }

  /* FIX ROUND (2026-07-27, rendering cost): Jon reported the sigil "still
     flashing a bunch" on mobile against the LIVE deployment, after the
     timing fix above (one shared 36s ease, staggered offsets) already
     shipped and made desktop smooth. That rules out timing as the cause on
     phones -- a slow, calm animation still repaints every frame, and the
     sigil is a max(1100px, 100vmin) SVG whose strokes run through a double
     feGaussianBlur (#rm-glow below). Re-rasterizing a filtered region that
     large every frame is expensive; phone GPUs drop or repaint it
     inconsistently, which reads as flashing even though nothing is
     "blinking" in the CSS sense. Slowing the animation further can't fix
     this -- the cost is per-frame work, not cycle length.

     Fix: stop animating entirely on touch/narrow viewports and serve a
     static sigil instead. Query is (max-width: 900px) AND (hover: none)
     AND (pointer: coarse) -- 900px covers phones and tablets in portrait
     (matching the "phones and tablets get static, desktops keep motion"
     goal), and hover:none/pointer:coarse restrict it to touch input so a
     desktop user who narrows their browser window (mouse, hover-capable)
     keeps the animation -- narrowing a desktop window was never the
     problem, touch-device repaint cost is. OR'd with the existing
     prefers-reduced-motion query above (that block already kills the
     animation; this block additionally swaps the expensive glow filter for
     a cheaper one so even the single static paint is cheap).

     The static frame is NOT just "whatever's left when animation:none
     fires" -- that would freeze each pulse at stroke-dashoffset:0, opacity
     1, i.e. five small default-length dashes bunched at each ring's path
     start (all near the top), which reads as a stopped animation, not a
     finished sigil. Instead every pulse gets an explicit static
     stroke-dasharray (a longer, deliberate glowing arc instead of a short
     tick) and a distinct stroke-dashoffset so the five arcs land at
     different points around the circle -- an intentional, asymmetric
     arrangement of teal energy, echoing the staggered phase offsets the
     live animation uses, rather than five marks stacked at one spot. */
  @media (max-width: 900px) and (hover: none) and (pointer: coarse),
         (prefers-reduced-motion: reduce) {
    .rm-sigil, .rm-sigil * { animation: none !important; }
    .rm-sigil .rm-pulse {
      /* Cheaper one-time paint: stdDeviation halved (7/2.2 -> 3.5/1.1) on
         the static-only filter below, so the sigil still glows but never
         asks a phone to rasterize the full-strength blur, not even once. */
      filter: url(#rm-glow-static);
      opacity: .84;
    }
    .rm-sigil .rm-pulse-a { stroke-dasharray: 42 58; stroke-dashoffset: -6; }
    .rm-sigil .rm-pulse-b { stroke-dasharray: 34 66; stroke-dashoffset: -34; }
    .rm-sigil .rm-pulse-c { stroke-dasharray: 46 54; stroke-dashoffset: -58; }
    .rm-sigil .rm-pulse-d { stroke-dasharray: 30 70; stroke-dashoffset: -80; }
    .rm-sigil .rm-pulse-e { stroke-dasharray: 38 62; stroke-dashoffset: -20; }
  }

  .rm-gate-card {
    position: relative; z-index: 1;
    max-width: 420px; width: 100%; background: var(--bg-card);
    border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding: var(--space-6) var(--space-5);
    text-align: center;
  }
  .rm-gate-mark { width: 40px; height: 40px; display: block; margin: 0 auto var(--space-3); opacity: .9; }
  .rm-gate-wordmark { margin: 0 0 var(--space-2); display: flex; justify-content: center; }
  .rm-gate-wordmark svg { width: min(300px, 68vw); height: auto; display: block; color: var(--accent); }
  .rm-gate-sub {
    color: var(--fg-secondary); font-size: var(--fs-base); line-height: var(--lh-base);
    margin: 0 0 var(--space-5);
  }
  form { display: flex; flex-direction: column; gap: var(--space-3); }
  label {
    text-align: left; font-size: var(--fs-sm); font-weight: var(--fw-medium);
    color: var(--fg-secondary);
  }
  input[type=text] {
    width: 100%; padding: 0.75rem 1rem; font-size: var(--fs-base); font-family: var(--font-mono);
    background: var(--bg-elevated); border: 1px solid var(--border-default);
    border-radius: var(--radius-md); color: var(--fg-primary);
  }
  input[type=text]::placeholder { color: var(--fg-subtle); }
  input[type=text]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent);
  }
  input[aria-invalid="true"] { border-color: var(--status-red); }
  button {
    width: 100%; padding: 0.75rem 1rem; font-size: var(--fs-base); font-weight: var(--fw-semibold);
    font-family: var(--font-sans);
    /* plum-500, not --accent (plum-400): --accent's contrast against
       --fg-on-garnet text measures 3.60:1, below AA's 4.5:1 for normal-size
       text. plum-500 measures 5.16:1 (hover plum-600: 6.98:1). Still an
       existing brand token from colors_and_type.css -- not a new color. */
    background: var(--plum-500); color: var(--fg-on-garnet, #fff);
    border: none; border-radius: var(--radius-md); cursor: pointer;
    transition: background var(--t-fast);
  }
  button:hover:not(:disabled) { background: var(--plum-600); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { background: var(--bg-muted); color: var(--fg-subtle); cursor: not-allowed; }
  #msg {
    margin-top: var(--space-3); font-size: var(--fs-sm); min-height: 1.2em;
    /* status-red on bg-card alone measures 4.37:1 -- just under AA's 4.5:1.
       Mixing in 20% white (still derived from the status-red token, not a
       new hardcoded color) brings it to ~5.69:1.
       color-mix() is unsupported in older Safari/Firefox/Chrome; an engine
       that doesn't understand it treats the whole declaration as invalid
       and drops it, keeping whatever was declared earlier in the cascade.
       So a plain fallback color is declared FIRST (#E67373 -- the literal
       computed result of the color-mix() below against dark-surface
       --bg-card, measured the same ~5.69:1), then color-mix() overrides it
       in engines that support it. Never lower the fallback below the
       color-mix() result -- that would make old browsers less readable
       than new ones, backwards from the point of a fallback. */
    color: #E67373;
    color: color-mix(in srgb, var(--status-red) 80%, white);
  }
  .rm-gate-footer {
    margin-top: var(--space-5); font-size: var(--fs-xs); color: var(--fg-subtle);
  }
</style>
</head>
<body data-surface="dark">
<svg class="rm-sigil" viewBox="-140 -140 760 760" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false" role="presentation">
  <defs>
    <filter id="rm-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur-wide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur-tight" />
      <feMerge>
        <feMergeNode in="blur-wide" />
        <feMergeNode in="blur-tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Cheaper static-only counterpart to #rm-glow, used on touch/narrow
         viewports (see the media query below) where the sigil doesn't
         animate. Same two-pass wide+tight glow, stdDeviation halved
         (7->3.5, 2.2->1.1) -- still reads as a soft glow around the teal
         arcs, just half the pixels to rasterize for what is now a single
         paint instead of a per-frame one. -->
    <filter id="rm-glow-static" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur-wide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur-tight" />
      <feMerge>
        <feMergeNode in="blur-wide" />
        <feMergeNode in="blur-tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- runic glyphs: abstract marks built as paths, never text/fonts. Not
         real script from any language -- invented marks, kept simple so
         they don't accidentally read as letters. -->
    <path id="rm-glyph-1" d="M234,-90 L240,-98 L246,-90" />
    <path id="rm-glyph-2" d="M234,-94 L238,-86 L242,-94 L246,-86" />
    <path id="rm-glyph-3" d="M240,-99 L240,-83 M234,-99 L246,-99" />
    <path id="rm-glyph-4" d="M244,-98 Q249,-90 240,-84" />
    <path id="rm-glyph-5" d="M240,-100 L246,-90 L240,-80 L234,-90 Z" />
    <path id="rm-glyph-6" d="M236,-94 L244,-86 M244,-94 L236,-86" />
  </defs>
  <!--
    Radius map (viewBox units, center 240,240) -- every ring/star below r=225
    was dropped this round because it can never clear the gate card's
    footprint at the sigil's size floor; nothing essential is drawn in that
    dead space anymore:
      star7 (7-pointed)  r=225   <- innermost surviving element
      doubled ring       r=250 / 246
      star9 (9-pointed)  r=280
      dashed ring        r=310
      glyph band         r=330
      outer ring         r=350
  -->
  <g fill="none" stroke="var(--plum-400)">

    <!-- seven-pointed star {7/3} -- innermost surviving geometry, still well
         outside the card's footprint at the sigil's size floor -->
    <g class="rm-grp-star7">
      <polygon class="rm-static" stroke="var(--plum-300)" stroke-width="1"
               points="240,15 337.64,442.75 64.05,99.72 459.46,290.09 20.54,290.09 415.95,99.72 142.36,442.75" />
      <path class="rm-pulse rm-pulse-e" pathLength="100" stroke-width="2.4"
            d="M240,15 L337.64,442.75 L64.05,99.72 L459.46,290.09 L20.54,290.09 L415.95,99.72 L142.36,442.75 Z" />
      <g class="rm-node">
        <circle cx="240" cy="15" r="3" /><circle cx="415.95" cy="99.72" r="3" />
        <circle cx="459.46" cy="290.09" r="3" /><circle cx="337.64" cy="442.75" r="3" />
        <circle cx="142.36" cy="442.75" r="3" /><circle cx="20.54" cy="290.09" r="3" />
        <circle cx="64.05" cy="99.72" r="3" />
      </g>
    </g>

    <!-- doubled ring, narrow gap -->
    <g class="rm-grp-double">
      <circle class="rm-static" cx="240" cy="240" r="250" stroke-width=".8" />
      <circle class="rm-static" cx="240" cy="240" r="246" stroke-width=".8" />
      <circle class="rm-pulse rm-pulse-c" cx="240" cy="240" r="248" pathLength="100" stroke-width="2.2" />
    </g>

    <!-- nine-pointed star {9/4} -->
    <g class="rm-grp-star9">
      <polygon class="rm-static" stroke="var(--plum-300)" stroke-width="1"
               points="240,-40 335.78,503.19 59.99,25.49 482.48,380.0 -35.79,191.38 515.79,191.38 -2.48,380.0 420.01,25.49 144.22,503.19" />
      <path class="rm-pulse rm-pulse-d" pathLength="100" stroke-width="2.4"
            d="M240,-40 L335.78,503.19 L59.99,25.49 L482.48,380.0 L-35.79,191.38 L515.79,191.38 L-2.48,380.0 L420.01,25.49 L144.22,503.19 Z" />
      <g class="rm-node">
        <circle cx="240" cy="-40" r="3" /><circle cx="420.01" cy="25.49" r="3" />
        <circle cx="515.79" cy="191.38" r="3" /><circle cx="482.48" cy="380.0" r="3" />
        <circle cx="335.78" cy="503.19" r="3" /><circle cx="144.22" cy="503.19" r="3" />
        <circle cx="-2.48" cy="380.0" r="3" /><circle cx="-35.79" cy="191.38" r="3" />
        <circle cx="59.99" cy="25.49" r="3" />
      </g>
    </g>

    <!-- dashed ring -->
    <g class="rm-grp-dashed">
      <circle class="rm-static" cx="240" cy="240" r="310" stroke-width="1" stroke-dasharray="4 10" />
      <circle class="rm-pulse rm-pulse-b" cx="240" cy="240" r="310" pathLength="100" stroke-width="2.2" />
    </g>

    <!-- band of runic glyphs -->
    <g class="rm-grp-glyphs rm-static-faint" stroke="var(--plum-300)" stroke-width="1.3" stroke-linecap="round">
      <use href="#rm-glyph-1" transform="rotate(0 240 240)" />
      <use href="#rm-glyph-2" transform="rotate(18 240 240)" />
      <use href="#rm-glyph-3" transform="rotate(36 240 240)" />
      <use href="#rm-glyph-4" transform="rotate(54 240 240)" />

      <use href="#rm-glyph-6" transform="rotate(90 240 240)" />
      <use href="#rm-glyph-1" transform="rotate(108 240 240)" />
      <use href="#rm-glyph-2" transform="rotate(126 240 240)" />
      <use href="#rm-glyph-3" transform="rotate(144 240 240)" />
      <use href="#rm-glyph-4" transform="rotate(162 240 240)" />
      <use href="#rm-glyph-5" transform="rotate(180 240 240)" />
      <use href="#rm-glyph-6" transform="rotate(198 240 240)" />
      <use href="#rm-glyph-1" transform="rotate(216 240 240)" />
      <use href="#rm-glyph-2" transform="rotate(234 240 240)" />
      <use href="#rm-glyph-3" transform="rotate(252 240 240)" />
      <use href="#rm-glyph-4" transform="rotate(270 240 240)" />
      <use href="#rm-glyph-5" transform="rotate(288 240 240)" />
      <use href="#rm-glyph-6" transform="rotate(306 240 240)" />
      <use href="#rm-glyph-1" transform="rotate(324 240 240)" />
      <use href="#rm-glyph-2" transform="rotate(342 240 240)" />
    </g>

    <!-- outer ring: solid hairline -->
    <g class="rm-grp-outer">
      <circle class="rm-static" cx="240" cy="240" r="350" stroke-width=".9" />
      <circle class="rm-pulse rm-pulse-a" cx="240" cy="240" r="350" pathLength="100" stroke-width="2.4" />
    </g>
  </g>
</svg>

  <p class="rm-gate-sub">This demo is access-code gated. If you don't have a code, ask Jon Gorecki for one.</p>
  <!-- method/action make this a real form: it works with JavaScript
       disabled or broken (extension conflict, CSP, old browser) -- a
       native submit posts here and /unlock 303-redirects to "/" on
       success or re-renders a friendly styled page on failure. The script
       below is a progressive enhancement on top (skips the full
       navigation when it runs), never the only path to unlocking. -->
  <form id="gate-form" method="post" action="/unlock" novalidate>
    <label for="code">Access code</label>
    <input type="text" id="code" name="code" placeholder="e.g. osprey-sycamore-peregrine-23"
           autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
    <button type="submit" id="submit-btn">Unlock</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
  <p class="rm-gate-footer">Rulemancer is a personal project by Jon Gorecki.</p>
</div>
<script>
  document.getElementById("gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const input = document.getElementById("code");
    const msg = document.getElementById("msg");
    const code = input.value.trim();
    if (!code) {
      input.setAttribute("aria-invalid", "true");
      msg.textContent = "Enter a code first.";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Checking…";
    msg.textContent = "";
    input.removeAttribute("aria-invalid");
    try {
      // Accept + X-Requested-With mark this as a fetch call, not a page
      // navigation -- the server (see _unlock_wants_json in main.py) uses
      // that to keep returning JSON here while a plain browser POST (no
      // JS) gets a redirect instead. Explicit, not inferred from the
      // browser's default fetch Accept ("*/*"), which is ambiguous.
      const resp = await fetch("/unlock", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "Accept": "application/json",
          "X-Requested-With": "XMLHttpRequest",
        },
        body: "code=" + encodeURIComponent(code),
      });
      if (resp.ok) {
        window.location.reload();
        return;
      }
      input.setAttribute("aria-invalid", "true");
      // Mobile UX audit fix (finding 1): the server's specific detail (bad
      // code vs. revoked vs. rate-limited -- each with its own remedy) is
      // read from the JSON body instead of collapsing every non-OK /unlock
      // response into one generic string that told a rate-limited visitor
      // to "try again" when the actual fix is to wait. Falls back to the
      // old generic sentence only if the body is missing or unparseable.
      let detail = "";
      try { detail = (await resp.json()).detail || ""; } catch { /* body missing or not JSON */ }
      msg.textContent = detail || "That code didn't work. Check it and try again.";
    } catch (err) {
      msg.textContent = "Something went wrong. Try again in a moment.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Unlock";
    }
  });
</script>
