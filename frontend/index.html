<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rulemancer</title>
<link rel="icon" href="assets/rulemancer-mark.svg" />
<link rel="stylesheet" href="colors_and_type.css?v=3" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  textarea { font-family: var(--font-sans); }
  @keyframes rm-spin { to { transform: rotate(360deg); } }
  @keyframes rm-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rm-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes rm-dot { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  @keyframes rm-slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .rm-scroll::-webkit-scrollbar { width: 10px; }
  .rm-scroll::-webkit-scrollbar-thumb { background: var(--parchment-300); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
  /* Plum brand ramp — primary accent (teal stays secondary), from the design */
  :root {
    --plum-50:#F4EFF8; --plum-100:#E5DAF0; --plum-200:#CDB7E0; --plum-300:#B191CE;
    --plum-400:#9469B4; --plum-500:#7C4E9E; --plum-600:#653C86; --plum-700:#4F2E6B;
    --plum-800:#382050; --plum-900:#241334;
    --accent: var(--plum-600); --accent-hover: var(--plum-700);
    --accent-soft: var(--plum-100); --accent-link: var(--plum-500);
  }
  ::selection { background: var(--plum-200); color: var(--plum-900); }
  [data-surface="dark"] {
    --bg-page:#17131F; --bg-elevated:#241D2E; --bg-card:#201A2A; --bg-muted:#2E2640;
    --bg-overlay:rgba(0,0,0,.62); --border-default:#392F4A; --border-strong:#4E4166;
    --fg-primary:#F1ECF4; --fg-secondary:#C6BDCD; --fg-muted:#928899; --fg-subtle:#6C6379;
    --accent:var(--plum-400); --accent-hover:var(--plum-300);
    --accent-soft:rgba(148,105,180,0.24); --accent-link:var(--plum-300);
  }
  [data-surface="dark"] .rm-scroll::-webkit-scrollbar-thumb { background:#3a3242; }
  button { font-family: var(--font-sans); }
  .rm-hover:hover { background: rgba(255,255,255,.08) !important; }
  .rm-pill-hover:hover { border-color: var(--accent) !important; color: var(--accent) !important; }
  .rm-act:hover { background: var(--bg-muted) !important; color: var(--accent) !important; }
  .rm-cite:hover { border-color: var(--accent-link) !important; color: var(--accent) !important; }
  .rm-send:hover { background: var(--accent-hover) !important; }
  /* @-picker dropdown */
  #rm-ac { position:absolute; left:0; right:0; bottom:calc(100% + 6px); background:var(--bg-card);
    border:1px solid var(--border-strong); border-radius:12px; box-shadow:var(--shadow-lg);
    overflow:hidden; z-index:60; display:none; max-height:264px; overflow-y:auto; }
  #rm-ac .rm-ac-item { padding:9px 14px; font-size:14px; color:var(--fg-secondary); cursor:pointer;
    display:flex; align-items:center; gap:9px; }
  #rm-ac .rm-ac-item .rm-at { color:var(--teal-500); font-family:var(--font-mono); font-size:12px; }
  #rm-ac .rm-ac-item.rm-ac-on, #rm-ac .rm-ac-item:hover { background:var(--accent-soft); color:var(--accent); }
  #rm-ac .rm-ac-head { padding:7px 14px 4px; font-size:10px; text-transform:uppercase;
    letter-spacing:.13em; color:var(--fg-muted); }
</style>
</head>

<script>
"use strict";
const API_BASE = (window.RULESMANCER_API !== undefined) ? window.RULESMANCER_API
  : (location.protocol.startsWith("http") ? "" : "http://localhost:8000");
// Same-origin when the API serves the frontend itself (run.py / the StaticFiles
// mount, any port); localhost:8000 only as the fallback for a file:// open.
const MARK = "assets/rulemancer-mark.svg";

const ARCANE = ["attacking","blocking","casting","conjuring","divining","untapping","scrying","reviving",
  "regenerating","brewing","mystifying","disguising","manifesting","tapping","exiling","countering",
  "resolving","surveiling","foretelling","proliferating","cascading","convoking","channeling","incanting",
  "prophesying","transmuting","populating","unsummoning","enchanting","riffling","adjudicating"];
const EXAMPLES = [
  "Does trample get through deathtouch?",
  "Can I respond to a land being played?",
  "How does cascade interact with the stack?",
  "If I copy [Emrakul, the Promised End]'s cast trigger, do I control two turns?",
];

// ---- SVG icons -------------------------------------------------------------
const I = {
  menu:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',

  hist:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.5 2.8L3 8"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>',
  sun:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

  copy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>',
  regen:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>',

};
// Feedback thumbs reuse the existing thumb-shaped I.up / I.down icons (same
// stroke style/size already used for the old local-only feedback toggle) --
// aliased under the names the spec calls for rather than duplicating the SVGs.
I.thumbUp = I.up;
I.thumbDown = I.down;

// ---- state -----------------------------------------------------------------
const state = {
  darkMode: (localStorage.getItem("rm-theme") || "dark") === "dark",
  view: "welcome",
  messages: [],
  thinking: false,
  thinkingWord: "consulting",
  sidebarExpanded: false,
  drawer: null,
  toast: "",
  input: "",
  history: JSON.parse(localStorage.getItem("rm-history") || "[]"),
};
let uid = 0;
let thinkTimer = null, toastTimer = null;

const esc = (s) => (s == null ? "" : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));
const app = document.getElementById("app");

// ---- API -------------------------------------------------------------------
async function askApi(question, history) {
  const r = await fetch(API_BASE + "/answer", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, history: history || [] }),
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function autocompleteApi(q) {
  try {
    const r = await fetch(API_BASE + "/cards/autocomplete?q=" + encodeURIComponent(q));
    if (!r.ok) return [];
    return (await r.json()).suggestions || [];
  } catch { return []; }
}

// ---- send / receive --------------------------------------------------------
function rand() { return ARCANE[Math.floor(Math.random() * ARCANE.length)]; }

function clearComposer() {
  // Clear BOTH state and the live textarea. render() re-captures the DOM value
  // to preserve in-progress drafts across re-renders, so clearing state alone
  // gets overwritten by that capture and the just-sent text reappears in the
  // box (the duplicate-info bug). Emptying the DOM first makes the capture
  // read "" and the clear stick.
  state.input = "";
  const ta = document.getElementById("rm-composer");
  if (ta) { ta.value = ""; autoGrow(ta); }
  hideAC();
}

function apiHistory() {
  // Prior turns for the API: everything BEFORE the trailing (current) user
  // turn, minus engine-error bubbles. The backend keeps the last 12.
  return state.messages.slice(0, -1)
    .filter(m => !m.error)
    .map(m => ({ role: m.role, content: (m.paras || []).join("\n\n") }))
    .slice(-12);
}

async function runQuestion(text) {
  // Assumes state.messages already ends with the user turn asking `text`
  // (send pushes it; regen re-uses the existing one -- no duplicate bubble).
  state.view = "chat";
  state.thinking = true;
  state.thinkingWord = rand();
  render();
  clearInterval(thinkTimer);
  thinkTimer = setInterval(() => { state.thinkingWord = rand(); paintThinking(); }, 850);

  try {
    const d = await askApi(text, apiHistory());
    const paras = (d.answer || "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    const ruleCites = (d.citations || []).filter(c => c.kind !== "card");
    state.messages.push({
      id: ++uid, role: "assistant", answered: d.answered,
      paras: paras.length ? paras : ["(no answer)"],
      citations: ruleCites, cards: d.cards || [], feedback: null,
      tldr: d.tldr || "",
      suggested_followups: Array.isArray(d.suggested_followups) ? d.suggested_followups.slice(0, 3) : [],
      requestId: d.request_id || null,
      tab: "simple",
    });
  } catch (e) {
    state.messages.push({
      id: ++uid, role: "assistant", answered: false, error: true,
      paras: ["I couldn't reach the rules engine (" + esc(e.message) + "). Make sure the API is running (uv run python run.py) and reachable at " + esc(API_BASE || location.origin) + "."],
      citations: [], cards: [], feedback: null,
    });
  }
  clearInterval(thinkTimer);
  state.thinking = false;
  render();
  saveHistory();
}

async function send(textArg) {
  const raw = typeof textArg === "string" ? textArg : state.input;
  const text = (raw || "").trim();
  if (!text || state.thinking) return;
  state.messages.push({ id: ++uid, role: "user", paras: [text] });
  clearComposer();
  await runQuestion(text);
}

function regen() {
  if (state.thinking) return;
  if (!state.messages.length || state.messages[state.messages.length - 1].role !== "assistant") return;
  state.messages.pop();  // drop the answer being regenerated; keep the user turn
  const last = state.messages[state.messages.length - 1];
  if (!last || last.role !== "user") { render(); return; }
  runQuestion(last.paras[0]);
}

function newChat() {
  clearInterval(thinkTimer);
  archiveCurrent();
  state.view = "welcome"; state.messages = [];
  state.thinking = false; state.sidebarExpanded = false; state.drawer = null;
  clearComposer();   // DOM + state, so render()'s draft-capture can't resurrect it
  render();
}

// ---- history (localStorage) ------------------------------------------------
function archiveCurrent() {
  if (!state.messages.length) return;
  const firstU = state.messages.find(m => m.role === "user");
  if (!firstU) return;
  const title = firstU.paras[0].replace(/\[|\]/g, "").slice(0, 60);
  state.history = state.history.filter(h => h.title !== title);
  state.history.unshift({ id: ++uid, title, messages: JSON.parse(JSON.stringify(state.messages)) });
  state.history = state.history.slice(0, 12);
}
function saveHistory() {
  archiveCurrent();
  localStorage.setItem("rm-history", JSON.stringify(state.history));
}
function loadHistory(id) {
  const h = state.history.find(x => x.id === id);
  if (!h) return;
  state.view = "chat"; state.messages = JSON.parse(JSON.stringify(h.messages));
  state.thinking = false; state.sidebarExpanded = false; state.drawer = null;
  clearComposer();
  render();
}

// ---- drawer ----------------------------------------------------------------
function openCite(mi, ci) {
  const c = state.messages[mi].citations[ci];
  state.drawer = {
    kicker: c.kind === "glossary" ? "Glossary" : "Comprehensive Rules",

}
function openCard(mi, ki) {
  const card = state.messages[mi].cards[ki];
  state.drawer = {

    meta: [card.mana_cost, card.type_line].filter(Boolean).join("  ·  "),

// ---- feedback (thumbs up/down -> POST /feedback) ---------------------------
// feedbackNoteFor holds the message index currently showing the inline
// "what's wrong?" box (transient UI state, not persisted to history).
let feedbackNoteFor = null;

async function postFeedback(requestId, verdict, note) {
  if (!requestId) return;
  try {
    await fetch(API_BASE + "/feedback", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request_id: requestId, verdict, note: note || undefined }),
    });
  } catch (e) { /* fire-and-forget; a failed vote must not break the UI */ }
}
function voteUp(mi) {
  const m = state.messages[mi];
  if (!m || m.feedback || !m.requestId) return;
  m.feedback = "up";
  feedbackNoteFor = null;
  postFeedback(m.requestId, "up");
  render();
  saveHistory();
}
function voteDownStart(mi) {
  const m = state.messages[mi];
  if (!m || m.feedback || !m.requestId) return;
  m.feedback = "down";
  postFeedback(m.requestId, "down");
  feedbackNoteFor = mi;
  render();
  saveHistory();
}
function feedbackNoteSubmit(mi) {
  const m = state.messages[mi];
  const input = document.getElementById("rm-fb-note-" + mi);
  const note = input ? input.value.trim() : "";
  if (m) postFeedback(m.requestId, "down", note);
  feedbackNoteFor = null;
  render();
}
function feedbackNoteCancel() {
  feedbackNoteFor = null;
  render();
}
function wireFeedbackNote(mi) {
  const input = document.getElementById("rm-fb-note-" + mi);
  if (!input) return;
  input.focus();
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); feedbackNoteSubmit(mi); }
    else if (e.key === "Escape") { e.preventDefault(); feedbackNoteCancel(); }
  });
  // Skip-by-clicking-elsewhere: a blur that isn't immediately followed by the
  // Send click (which re-renders and resets feedbackNoteFor first) collapses
  // to the thanks state, same pattern as the @-picker's blur/hideAC.
  input.addEventListener("blur", () => setTimeout(() => {
    if (feedbackNoteFor === mi) feedbackNoteCancel();
  }, 150));
}

function citeCard(m, mi) {
  let out = "";

    const rows = m.citations.map((c, ci) => {

    out += `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;">
      <span style="font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--fg-muted);">Cards</span>${chips}</div>`;

      <div style="max-width:78%;background:var(--accent-soft);color:var(--fg-primary);border:1px solid var(--border-strong);padding:11px 15px;border-radius:14px 14px 4px 14px;font-size:15px;line-height:1.5;">${m.paras.map(p=>`<div>${esc(p)}</div>`).join("")}</div></div>`;

  const badge = m.error
    ? `<span style="font-size:10px;font-weight:600;color:var(--status-red);background:rgba(224,80,80,.12);padding:2px 7px;border-radius:999px;">ERROR</span>`
    : (m.answered === false
      ? `<span style="font-size:10px;font-weight:600;color:var(--status-yellow);background:rgba(224,167,64,.15);padding:2px 7px;border-radius:999px;">NOT IN THE RULES</span>`
      : `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--teal-700);background:#d9f0ec;padding:2px 7px;border-radius:999px;">${I.check}JUDGE</span>`);
  // Pre-upgrade history rows have no tldr -- fall back to Full-only, no tabs.
  const hasTldr = !m.error && !!(m.tldr && m.tldr.trim());
  const tab = hasTldr ? (m.tab || "simple") : "full";
  const body = (hasTldr && tab === "simple") ? simpleBody(m) : fullBody(m, mi);
  return `<div style="display:flex;gap:13px;animation:rm-rise .35s var(--ease-out);">
    ${markImg(34,"flex:none;")}
    <div style="flex:1;min-width:0;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
        <span style="font-weight:600;font-size:14px;color:var(--fg-primary);">Rulemancer</span>${badge}</div>
      ${hasTldr ? answerTabs(mi, tab) : ""}
      ${body}
      ${m.error ? "" : followupPills(m, mi)}
      ${m.error ? "" : assistantActions(m, mi)}
    </div></div>`;
}

function thinkingEl() {
  return `<div id="rm-thinking" style="display:flex;gap:13px;align-items:center;">
    ${markImg(34,"flex:none;animation:rm-spin 3.4s linear infinite;")}
    <div style="display:flex;align-items:center;gap:9px;">
      <span id="rm-thinkword" style="font-size:15px;font-weight:500;background:linear-gradient(90deg,var(--plum-300),var(--plum-500),var(--plum-300));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rm-shimmer 2s linear infinite;">${esc(state.thinkingWord)}…</span>
      <span style="display:inline-flex;gap:3px;">
        <span style="width:5px;height:5px;border-radius:999px;background:var(--accent);animation:rm-dot 1.2s infinite;"></span>
        <span style="width:5px;height:5px;border-radius:999px;background:var(--accent);animation:rm-dot 1.2s infinite .2s;"></span>
        <span style="width:5px;height:5px;border-radius:999px;background:var(--accent);animation:rm-dot 1.2s infinite .4s;"></span>
      </span></div></div>`;
}
function paintThinking() { const el = document.getElementById("rm-thinkword"); if (el) el.textContent = state.thinkingWord + "…"; }

function chat() {
  const msgs = state.messages.map((m, i) => messageEl(m, i)).join("");
  return `<div style="height:52px;flex:none;border-bottom:1px solid var(--bg-muted);display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--bg-elevated);">
      ${markImg(24)}
      <span style="font-weight:600;font-size:16px;color:var(--fg-primary);letter-spacing:-0.01em;line-height:1;">Rulemancer</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--teal-700);background:#d9f0ec;padding:3px 8px;border-radius:999px;">Comprehensive Rules · 2026</span>
    </div>
    <div class="rm-scroll" id="rm-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 24px 8px;">
      <div style="max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px;">
        ${msgs}${state.thinking ? thinkingEl() : ""}<div style="height:8px;"></div>
      </div>
    </div>
    <div style="flex:none;padding:12px 24px 20px;background:linear-gradient(to top,var(--bg-page) 70%,transparent);">
      <div style="max-width:760px;margin:0 auto;">${composer("Ask a follow-up rules question…", false)}</div>
    </div>`;
}

function drawerEl() {
  if (!state.drawer) return "";
  const d = state.drawer;
  const rulings = d.rulings && d.rulings.length
    ? `<div style="padding:2px 20px 8px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--teal-700);font-weight:600;margin:6px 0 8px;">Relevant rulings</div>${d.rulings.map(r=>`<div style="display:flex;gap:9px;font-size:13px;color:var(--fg-secondary);line-height:1.5;margin-bottom:8px;"><span style="color:var(--teal-500);">✦</span><span>${esc(r)}</span></div>`).join("")}</div>` : "";
  const scry = d.scryfall ? `<div style="padding:0 20px 18px;"><a href="${d.scryfall}" target="_blank" rel="noopener" style="font-size:12.5px;color:var(--accent-link);">View on Scryfall ↗</a></div>` : "";
  const meta = d.meta ? `<div style="padding:2px 20px 0;font-family:var(--font-mono);font-size:12px;color:var(--fg-muted);">${esc(d.meta)}</div>` : "";
  return `<div data-action="close-drawer" style="position:absolute;inset:0;background:var(--bg-overlay);z-index:50;animation:rm-rise .2s var(--ease-out);"></div>
    <aside class="rm-scroll" style="position:absolute;top:0;right:0;bottom:0;width:440px;max-width:90%;background:var(--bg-card);border-left:1px solid var(--border-default);box-shadow:var(--shadow-lg);z-index:51;overflow-y:auto;animation:rm-slide .28s var(--ease-out);">
      <div style="position:sticky;top:0;background:var(--bg-card);border-bottom:1px solid var(--border-default);padding:16px 20px;display:flex;align-items:flex-start;gap:12px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--teal-700);font-weight:600;">${esc(d.kicker)}</div>
          <div style="font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--accent);margin-top:5px;word-break:break-word;">${esc(d.code)}</div>
        </div>
        <button data-action="close-drawer" title="Close" style="width:32px;height:32px;flex:none;border:none;background:var(--bg-muted);color:var(--fg-secondary);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;">${I.x}</button>
      </div>
      ${meta}
      <div style="padding:16px 20px;font-size:14px;line-height:1.65;color:var(--fg-secondary);white-space:pre-wrap;">${esc(d.text)}</div>
      ${rulings}${scry}
    </aside>`;
}

function toastEl() {
  if (!state.toast) return "";
  return `<div style="position:absolute;bottom:104px;left:50%;transform:translateX(-50%);background:var(--plum-800);color:#F2EAEC;font-size:13.5px;border:1px solid var(--border-strong);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-lg);z-index:40;animation:rm-rise .25s var(--ease-out);display:flex;align-items:center;gap:9px;"><span style="color:var(--teal-300);">✦</span>${esc(state.toast)}</div>`;
}

function render() {
  // preserve composer input + focus across the re-render
  const prev = document.getElementById("rm-composer");
  if (prev) state.input = prev.value;
  const hadFocus = prev && document.activeElement === prev;

  app.innerHTML = `<div data-surface="${state.darkMode?"dark":"light"}" style="display:flex;height:100vh;width:100%;background:var(--bg-page);color:var(--fg-primary);overflow:hidden;">
    ${iconRail()}${flyout()}
    <main style="flex:1;min-width:0;display:flex;flex-direction:column;position:relative;">
      ${state.view === "welcome" ? welcome() : chat()}
      ${toastEl()}${drawerEl()}
    </main></div>`;

  const ta = document.getElementById("rm-composer");
  if (ta) {
    ta.value = state.input || "";
    autoGrow(ta);
    if (hadFocus) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
    wireComposer(ta);
  }
  const sc = document.getElementById("rm-scroll");
  if (sc) requestAnimationFrame(() => { sc.scrollTop = sc.scrollHeight; });

  if (feedbackNoteFor != null) wireFeedbackNote(feedbackNoteFor);
}

// ---- composer wiring: autogrow + @-autocomplete + Enter --------------------
function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 200) + "px"; }

let acItems = [], acIndex = -1, acStart = -1, acTimer = null, acReqId = 0;

function acEl() { return document.getElementById("rm-ac"); }
function hideAC() { acItems = []; acIndex = -1; acStart = -1; const el = acEl(); if (el) el.style.display = "none"; }

function renderAC() {
  const el = acEl(); if (!el) return;
  if (!acItems.length) { el.style.display = "none"; return; }
  el.innerHTML = `<div class="rm-ac-head">Insert a card</div>` + acItems.map((name, i) =>
    `<div class="rm-ac-item ${i===acIndex?"rm-ac-on":""}" data-ac="${i}"><span class="rm-at">@</span>${esc(name)}</div>`).join("");
  el.style.display = "block";
  el.querySelectorAll(".rm-ac-item").forEach(node => {
    node.addEventListener("mousedown", (e) => { e.preventDefault(); selectAC(parseInt(node.dataset.ac, 10)); });
  });
}

function currentAtToken(ta) {
  const caret = ta.selectionStart;
  const upto = ta.value.slice(0, caret);
  const at = upto.lastIndexOf("@");
  if (at === -1) return null;
  const frag = upto.slice(at + 1);
  if (/[\[\]\n]/.test(frag)) return null;     // token ended by a bracket/newline
  return { start: at, query: frag };
}

function handleComposerInput(ta) {
  state.input = ta.value;
  autoGrow(ta);
  const tok = currentAtToken(ta);
  if (!tok || tok.query.trim().length < 2) { hideAC(); return; }
  acStart = tok.start;
  clearTimeout(acTimer);
  const reqId = ++acReqId;
  acTimer = setTimeout(async () => {
    const items = await autocompleteApi(tok.query.trim());
    if (reqId !== acReqId) return;             // stale response
    acItems = items.slice(0, 8); acIndex = items.length ? 0 : -1;
    renderAC();
  }, 160);
}

function selectAC(i) {
  const ta = document.getElementById("rm-composer");
  if (!ta || i < 0 || i >= acItems.length || acStart < 0) return;
  const caret = ta.selectionStart;
  const before = ta.value.slice(0, acStart);
  const after = ta.value.slice(caret);
  const insert = "[" + acItems[i] + "] ";
  ta.value = before + insert + after;
  const pos = (before + insert).length;
  ta.selectionStart = ta.selectionEnd = pos;
  state.input = ta.value;
  hideAC(); autoGrow(ta); ta.focus();
}

function wireComposer(ta) {
  ta.addEventListener("input", () => handleComposerInput(ta));
  ta.addEventListener("blur", () => setTimeout(hideAC, 120));
  ta.addEventListener("keydown", (e) => {
    if (acItems.length) {
      if (e.key === "ArrowDown") { e.preventDefault(); acIndex = (acIndex + 1) % acItems.length; renderAC(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); acIndex = (acIndex - 1 + acItems.length) % acItems.length; renderAC(); return; }
      if (e.key === "Enter" && acIndex >= 0) { e.preventDefault(); selectAC(acIndex); return; }
      if (e.key === "Escape") { e.preventDefault(); hideAC(); return; }
    }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
}

// ---- event delegation ------------------------------------------------------
app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const a = t.dataset.action, mi = t.dataset.mi != null ? +t.dataset.mi : null;
  switch (a) {
    case "send": send(); break;
    case "new-chat": newChat(); break;
    case "toggle-theme": toggleTheme(); break;
    case "toggle-sidebar": toggleSidebar(); break;
    case "example": send(t.dataset.arg); break;
    case "followup": send(t.dataset.arg); break;
    case "load-history": loadHistory(+t.dataset.arg); break;
    case "open-cite": openCite(+t.dataset.mi, +t.dataset.ci); break;
    case "open-card": openCard(+t.dataset.mi, +t.dataset.ki); break;
    case "close-drawer": closeDrawer(); break;
    case "copy": copyMsg(mi); break;
    case "regen": regen(); break;
    case "thumb-up": voteUp(mi); break;
    case "thumb-down": voteDownStart(mi); break;
    case "feedback-send": feedbackNoteSubmit(mi); break;
    case "answer-tab": {
      const parts = (t.dataset.arg || "").split(":");
      setAnswerTab(+parts[0], parts[1]);
      break;
    }
    case "report": report(); break;
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.drawer) closeDrawer(); });

render();
</script>
</body>
</html>
