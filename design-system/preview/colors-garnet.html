<!-- @dsCard group="Colors" name="Garnet ramp" subtitle="Primary brand axis · 50–900" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garnet ramp — Rulemancer</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0}
  body{width:760px;height:220px;background:var(--parchment-100);padding:26px 30px;
       box-sizing:border-box;font-family:var(--font-sans);color:var(--ink-900)}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-500);
           font-weight:600;margin-bottom:16px}
  .ramp{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-md)}
  .sw{flex:1;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px}
  .sw b{font-size:11px;font-weight:600}
  .sw span{font-family:var(--font-mono);font-size:9.5px;opacity:.85}
  .note{margin-top:14px;font-size:12px;color:var(--ink-500)}
  .note b{color:var(--garnet-600)}
</style>
</head>
<body>
  <div class="eyebrow">Colors · Garnet (primary)</div>
  <div class="ramp">
    <div class="sw" style="background:#F8EFF1;color:#7C2530"><b>50</b><span>#F8EFF1</span></div>
    <div class="sw" style="background:#EAD8DB;color:#7C2530"><b>100</b><span>#EAD8DB</span></div>
    <div class="sw" style="background:#D9BEC2;color:#7C2530"><b>200</b><span>#D9BEC2</span></div>
    <div class="sw" style="background:#C69AA1;color:#3a1418"><b>300</b><span>#C69AA1</span></div>
    <div class="sw" style="background:#AC6470;color:#fff"><b>400</b><span>#AC6470</span></div>
    <div class="sw" style="background:#973C49;color:#fff"><b>500</b><span>#973C49</span></div>
    <div class="sw" style="background:#7C2530;color:#fff"><b>600 ·</b><span>#7C2530</span></div>
    <div class="sw" style="background:#631C26;color:#fff"><b>700</b><span>#631C26</span></div>
    <div class="sw" style="background:#49151C;color:#EAD8DB"><b>800</b><span>#49151C</span></div>
    <div class="sw" style="background:#2B0F13;color:#EAD8DB"><b>900</b><span>#2B0F13</span></div>
  </div>
  <div class="note"><b>600</b> is the primary — wordmark, links, and accents. 800 carries dark panels (deep garnet, no navy).</div>
</body>
</html>
