<!-- @dsCard group="Colors" name="Neutrals & accent" subtitle="Parchment, ink, teal, status" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neutrals & accent — Rulemancer</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0}
  body{width:760px;height:300px;background:var(--parchment-100);padding:24px 30px;
       box-sizing:border-box;font-family:var(--font-sans);color:var(--ink-900)}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-500);
           font-weight:600;margin:0 0 8px}
  .grid{display:flex;gap:18px}
  .col{flex:1}
  .strip{display:flex;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:56px;display:flex;align-items:flex-end;padding:5px 6px;font-family:var(--font-mono);font-size:9px}
  .dots{display:flex;gap:10px;margin-top:6px}
  .dot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-700)}
  .chip{width:16px;height:16px;border-radius:var(--radius-pill);box-shadow:var(--shadow-xs)}
  .accent-row{display:flex;gap:10px;margin-top:6px}
  .acc{flex:1;height:52px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;
       padding:6px 8px;font-family:var(--font-mono);font-size:9.5px;color:#fff}
</style>
</head>
<body>
  <div class="eyebrow">Parchment · neutral canvas</div>
  <div class="strip">
    <div class="sw" style="background:#FBF9F9;color:#6E6162">50</div>
    <div class="sw" style="background:#F2EFEF;color:#6E6162">100</div>
    <div class="sw" style="background:#E6DEDF;color:#6E6162">200</div>
    <div class="sw" style="background:#D3C7C8;color:#43323A">300</div>
    <div class="sw" style="background:#A99C9E;color:#fff">400</div>
    <div class="sw" style="background:#6E6162;color:#fff">500</div>
  </div>

  <div class="eyebrow" style="margin-top:16px">Ink · text on parchment</div>
  <div class="strip">
    <div class="sw" style="background:#241519;color:#EAD8DB">900</div>
    <div class="sw" style="background:#43323A;color:#EAD8DB">700</div>
    <div class="sw" style="background:#6B5B61;color:#fff">500</div>
    <div class="sw" style="background:#9E9095;color:#fff">300</div>
  </div>

  <div class="eyebrow" style="margin-top:16px">Teal · reserved accent &nbsp;·&nbsp; Status</div>
  <div class="accent-row">
    <div class="acc" style="background:#7ECFC2;color:#134a41">teal-300 · #7ECFC2</div>
    <div class="acc" style="background:#309B8C">teal-500 · #309B8C</div>
    <div class="acc" style="background:#1E6459">teal-700 · #1E6459</div>
    <div class="acc" style="background:#4CAF7C">green</div>
    <div class="acc" style="background:#E0A740">yellow</div>
    <div class="acc" style="background:#E05050">red</div>
  </div>
</body>
</html>
