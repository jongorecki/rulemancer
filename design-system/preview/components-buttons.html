<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, ghost, sigil CTA" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons — Rulemancer</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0}
  body{width:700px;height:240px;background:var(--parchment-100);padding:24px 28px;
       box-sizing:border-box;font-family:var(--font-sans);color:var(--ink-900)}
  .label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-500);font-weight:600;margin-bottom:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .btn{font-family:var(--font-sans);font-weight:500;font-size:14px;line-height:1;padding:10px 18px;
       border-radius:6px;border:1px solid transparent;cursor:pointer;transition:all 120ms ease-out;
       display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--garnet-600);color:#fff;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 1px 2px rgba(73,21,28,.18)}
  .btn-secondary{background:#fff;color:var(--garnet-600);border-color:var(--garnet-200)}
  .btn-ghost{background:transparent;color:var(--garnet-500)}
  .btn-sigil{background:var(--garnet-600);color:#fff;
       box-shadow:0 0 24px rgba(48,155,140,.38),inset 0 1px 0 rgba(255,255,255,.15);
       border:1px solid var(--teal-500);padding:12px 22px;font-weight:600;font-size:15px}
  .btn-sigil .star{color:var(--teal-300);margin-right:4px}
  .btn-disabled{opacity:.45;cursor:not-allowed}
  .btn-sm{padding:6px 12px;font-size:12px}
</style>
</head>
<body>
  <div class="label">Primary · secondary · ghost</div>
  <div class="row">
    <button class="btn btn-primary">Ask the rules</button>
    <button class="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 44 L34 60 L66 24"/></svg>
      Cite sources
    </button>
    <button class="btn btn-secondary">Clear</button>
    <button class="btn btn-ghost">Advanced</button>
    <button class="btn btn-primary btn-disabled">Ask the rules</button>
  </div>
  <div class="label">Sigil CTA · teal glow · marketing accent</div>
  <div class="row">
    <button class="btn btn-sigil"><span class="star">✦</span> Consult the tome</button>
    <button class="btn btn-secondary" style="border-color:var(--teal-500);color:var(--teal-700)">Read the rulebook</button>
  </div>
</body>
</html>
