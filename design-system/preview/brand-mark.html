<!-- @dsCard group="Brand" name="Brand mark" subtitle="Tome logo, mark & tagline" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand mark — Rulemancer</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0}
  body{width:760px;height:300px;background:var(--parchment-100);padding:26px 30px;
       box-sizing:border-box;font-family:var(--font-sans);color:var(--ink-900);
       display:flex;flex-direction:column;gap:16px}
  .label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-500);font-weight:600}
  .lockup{height:96px}
  .lockup img{height:100%}
  .row{display:flex;align-items:center;gap:28px}
  .mark{width:88px;height:88px;background:#fff;border:1px solid var(--parchment-300);
        border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center}
  .mark img{width:66px;height:66px}
  .mark.on-red{background:var(--garnet-600);border-color:var(--garnet-700)}
  .desc{font-size:13px;line-height:1.6;color:var(--ink-700);max-width:420px}
  .desc b{color:var(--garnet-600)}
</style>
</head>
<body>
  <div>
    <div class="label" style="margin-bottom:10px">Horizontal lockup</div>
    <div class="lockup"><img src="../assets/rulemancer-logo.png" alt="Rulemancer"></div>
  </div>
  <div class="row">
    <div class="mark"><img src="../assets/rulemancer-mark.svg" alt="mark"></div>
    <div class="mark on-red"><img src="../assets/rulemancer-mark.svg" alt="mark on garnet"></div>
    <div class="desc">A <b>closed arcane tome</b> with a branching decision sigil — sibling to Cardomancer, tilted to the same angle. Rose cover, garnet linework, one reserved <b>teal</b> accent on the sigil nodes.</div>
  </div>
</body>
</html>
