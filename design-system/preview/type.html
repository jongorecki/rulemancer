<!-- @dsCard group="Type" name="Type scale" subtitle="Display, headings, body, mono" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Rulemancer</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0}
  body{width:760px;height:360px;background:var(--parchment-100);padding:28px 34px;
       box-sizing:border-box}
  .wordmark{font-family:var(--font-display);font-size:56px;line-height:1;color:var(--garnet-600);
            letter-spacing:-.01em}
  .tagline{font-family:var(--font-sans);font-size:12px;text-transform:uppercase;
           letter-spacing:.18em;color:var(--garnet-500);margin:8px 0 2px}
  .divider{height:1px;background:var(--garnet-600);opacity:.25;margin:14px 0 16px}
  .rowlabel{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);width:70px;display:inline-block}
  .line{display:flex;align-items:baseline;gap:16px;margin-bottom:10px}
  .h1s{font-family:var(--font-display);font-weight:700;font-size:40px;color:var(--garnet-600);line-height:1}
  .h3s{font-family:var(--font-sans);font-weight:600;font-size:24px;color:var(--ink-900);line-height:1}
  .bodys{font-family:var(--font-sans);font-size:16px;color:var(--ink-900);line-height:1.5}
  .monos{font-family:var(--font-mono);font-size:14px;color:var(--garnet-700)}
</style>
</head>
<body>
  <div class="wordmark">Rulemancer</div>
  <div class="tagline">Ask more · Learn more · Know more · Win more</div>
  <div class="divider"></div>
  <div class="line"><span class="rowlabel">display</span><span class="h1s">The 100.6 rule, explained</span></div>
  <div class="line"><span class="rowlabel">h3 · sans</span><span class="h3s">Priority and the stack</span></div>
  <div class="line"><span class="rowlabel">body</span><span class="bodys">A comprehensive rules answer in plain, readable Inter.</span></div>
  <div class="line"><span class="rowlabel">mono</span><span class="monos">rule 601.2c · CR 20250801 · #7C2530</span></div>
</body>
</html>
